print_label:
  fields:
    device_id:
      selector:
        device:
          integration: wp9529
    title:
      example: "Router"
      selector:
        text:
    text:
      example: "admin password in the vault"
      selector:
        text:
          multiline: true
    qr:
      example: "WIFI:T:WPA;S:Home;P:secret;;"
      selector:
        text:
    icon:
      selector:
        icon:
    copies:
      default: 1
      selector:
        number:
          min: 1
          max: 50
          mode: box
    density:
      selector:
        select:
          options: ["light", "normal", "dark"]
          translation_key: density
    label_length:
      selector:
        number:
          min: 10
          max: 100
          step: 0.5
          unit_of_measurement: mm
          mode: box
